<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 py-4 px-3">
  <div class="card card-login border-0 shadow-lg rounded-4">
    <div class="card-body p-5">

      @if (!submitted()) {
        <div class="text-center mb-4">
          <h3 class="fw-bold text-dark mb-2">Восстановление пароля</h3>
          <p class="text-body-secondary small mb-0">Введите логин — новый пароль будет отправлен на привязанную к нему почту</p>
        </div>

        <form (ngSubmit)="submit()">
          <div class="mb-4">
            <label for="login-input" class="form-label fw-semibold small text-dark">Логин</label>
            <input
              type="text"
              id="login-input"
              class="form-control form-control-lg rounded-3"
              placeholder="Введите логин"
              required
              autofocus
              [(ngModel)]="login"
              name="login"
              >
          </div>

          <button
            type="submit"
            [disabled]="isSubmitting() || !login?.trim()"
            class="btn btn-primary btn-lg w-100 rounded-pill py-2 fw-semibold shadow-sm">
            <i class="fas fa-paper-plane me-2"></i>Отправить
          </button>
        </form>

        <div class="text-center mt-4">
          <a routerLink="/login" class="link-action">
            <i class="fas fa-arrow-left me-1"></i>Вернуться ко входу
          </a>
        </div>
      } @else {
        <div class="text-center">
          <i class="fas fa-envelope-open-text fa-2x text-success mb-3"></i>
          <h5 class="fw-bold text-dark mb-3">Запрос отправлен</h5>
          <p class="text-body-secondary success-message mb-4">
            Если введённый логин зарегистрирован в системе, на привязанный к нему e-mail отправлено письмо с новым паролем.
          </p>
          <button type="button" class="btn btn-outline-primary rounded-pill px-4" (click)="backToLogin()">
            Вернуться ко входу
          </button>
        </div>
      }

    </div>
  </div>
</div>
