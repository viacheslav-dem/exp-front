<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 py-4 px-3">
  <div class="card card-login border-0 shadow-lg rounded-4">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <h3 class="fw-bold text-dark mb-2">Экспертиза</h3>
        <p class="text-body-secondary small mb-0">Войдите в систему</p>
      </div>

      <form (ngSubmit)="login()">
        <div class="mb-3">
          <label for="login-input" class="form-label fw-semibold small text-dark">Логин</label>
          <input 
            type="text" 
            id="login-input"
            class="form-control form-control-lg rounded-3" 
            placeholder="Введите логин" 
            required 
            autofocus
            [(ngModel)]="user.login" 
            name="login"
            >
        </div>

        <div class="mb-4">
          <label for="input-password" class="form-label fw-semibold small text-dark">Пароль</label>
          <div class="position-relative">
            <input 
              type="password" 
              id="input-password" 
              class="form-control form-control-lg rounded-3 pe-5" 
              placeholder="Введите пароль" 
              required
              [(ngModel)]="user.password" 
              name="password"
              >
            <button 
              type="button"
              class="btn btn-link position-absolute end-0 top-50 translate-middle-y me-2 p-0 text-body-secondary"
              (click)="toggleVisibility()"
              tabindex="-1"
              aria-label="Показать/скрыть пароль">
              <fa-icon 
                [icon]="showPassword ? 'eye-slash' : 'eye'" 
                id="password-icon" 
                class="password-icon" 
                [fixedWidth]="true">
              </fa-icon>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          [disabled]="isLoggingIn"
          class="btn btn-primary btn-lg w-100 rounded-pill py-2 fw-semibold shadow-sm">
          <i class="fas fa-sign-in-alt me-2"></i>Войти
        </button>
      </form>
    </div>

    @if (systemLoginNotification.enabled) {
      <div class="card-footer border-0 bg-transparent px-5 pb-4">
        <div class="alert alert-light border border-2 rounded-4 mb-0 p-3" [ngClass]="systemLoginNotification.type">
          <div [innerHTML]="notificationToSafeHtml(systemLoginNotification.message)"></div>
        </div>
      </div>
    }
  </div>
</div>
