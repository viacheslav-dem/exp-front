<div class="card pt-3">
  <h5 class="card-title">
    <span>История проведения экспертиз в ГЭС</span>
    <span *ifRole="Role.BUREAU_CHAIRMAN"> {{_council | councilCodeAndName}}</span>
  </h5>
  @if (role != Role.BUREAU_CHAIRMAN) {
    <div class="mb-05">
      <app-dropdown
        [options]="allCouncils()" [notSelected]="'ГЭС не выбран'"
        [(ngModel)]="_council" [emptyOptionsLabel]="'Данные об ГЭСах отсутствуют'"
        (onSelected)="update()" [resetEnabled]="false"
        [optionToString]="councilToString"
      ></app-dropdown>
    </div>
  }
  <div class="input-group input-group-sm">
    <input #dateFromInput type="text" class="form-control" title="Начальная дата"
      [(ngModel)]="dateFromValue"
      [bsConfig]="datePickerConfig"
      bsDatepicker
      (bsValueChange)="changeDateFrom($event)">
      <div class="input-group-append input-group-prepend">
        <div class="input-group-text">-</div>
      </div>
      <input #dateToInput type="text" class="form-control" title="Конечная дата"
        [(ngModel)]="dateToValue"
        [bsConfig]="datePickerConfig"
        bsDatepicker
        (bsValueChange)="changeDateTo($event)">
        <div class="input-group-append">
          <div class="input-group-text">
            <fa-icon icon="calendar"></fa-icon>
          </div>
        </div>
      </div>
      <div style="position: relative;">
        @if (chartLoading()) {
          <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0;
                      background: rgba(255,255,255,0.7); z-index: 10;
                      display: flex; align-items: center; justify-content: center;">
            <div class="text-center">
              <div class="spinner-border text-primary" role="status"></div>
              <div class="mt-2 text-muted">Загрузка списка объектов экспертизы...</div>
            </div>
          </div>
        }
        <div class="row">
          <div class="col-lg-12">
            <app-council-projects-chart [stats]="statsV2()"></app-council-projects-chart>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12">
            <app-council-results-chart [stats]="statsV2()"></app-council-results-chart>
          </div>
        </div>
      </div>
      <br>
        @if (role == Role.ADMIN) {
          <div style="display: flex; justify-content: flex-end;">
            <button class="btn btn-primary btn-sm mt-1" style="width: 250px" (click)="updateCouncilStatsForLastYear()">Обновить статистику за год</button>
            <button class="btn btn-primary btn-sm mt-1" style="width: 250px; margin-left: 10px" (click)="updateCouncilStatsForAllTime()">Обновить статистику за все время</button>
          </div>
        }
      </div>

      <project-list-from-stats (cancel)="hideListProjectsFromStats()"></project-list-from-stats>
