<app-modal #searchModal [title]="'Поиск кандидатуры'">
  <!--FILTER-->
  <app-filter
    [fields]="_searchFields" (onFilterChanged)="onFilterChanged()">
  </app-filter>

  <div [loadingData]="_loading">
    <!--PAGE-->
    <ul class="list-group list-group-sm mt-3">
      @for (user of _page.content; track user) {
        <li class="list-group-item list-group-item-action selectable"
          (click)="onSelected(user)">
          {{user | fullName}}
        </li>
      }
    </ul>

    @if (_page.totalElements == 0) {
      <div class="alert alert-info italic mb-0">
        Никто не найден
      </div>
    }

    <!--PAGINATION-->
    <app-pagination [page]="_page" [pagination]="_pagination"
    (onPageChanged)="onPageChanged($event)"></app-pagination>
  </div>
</app-modal>
