<div class="row">
  <!--data-->
  <div class="col-8 pr-0">
    <div class="card pt-3">
      <h5 class="card-title">Аудит</h5>
      <div [loadingData]="_loading">
        <table *ngIf="audit.length > 0" class="table table-responsive mb-0">
          <thead>
          <tr>
            <th class="selectable text-nowrap" (click)="sortBy('date')">
              <span>Дата </span>
              <fa-icon class="fa-active" *ngIf="sort.property == 'date'" [icon]="SortClass[this.sort.direction]"></fa-icon>
            </th>
            <th (click)="sortBy('person')" class="selectable" style="width: 33%">
              <span>Пользователь </span>
              <fa-icon class="fa-active" *ngIf="sort.property == 'person'" [icon]="SortClass[this.sort.direction]"></fa-icon>
            </th>
            <th (click)="sortBy('type')" class="selectable" style="width: 33%">
              <span>Тип </span>
              <fa-icon class="fa-active" *ngIf="sort.property == 'type'" [icon]="SortClass[this.sort.direction]"></fa-icon>
            </th>
            <th (click)="sortBy('message')" class="selectable" style="width: 34%">
              <span>Сообщение </span>
              <fa-icon class="fa-active" *ngIf="sort.property == 'message'" [icon]="SortClass[this.sort.direction]"></fa-icon>
            </th>
          </tr>
          </thead>
          <tbody>
          <tr class="list-group-item-action" *ngFor="let record of audit">
            <td class="text-nowrap">{{record.date | date:'dd.MM.yyyy HH:mm'}}</td>
            <td *ngIf="record.person">{{record.person | fullName}}</td>
            <td *ngIf="!record.person">Неавторизованный пользователь</td>
            <td>{{record.type | auditType}}</td>
            <td>{{record.message | short:120}}</td>
          </tr>
          </tbody>
        </table>
        <div *ngIf="audit.length == 0" class="alert alert-info italic mb-0">Записи отсутствуют</div>
        <app-pagination [page]="_page" [pagination]="_pagination"
                        (onPageChanged)="onPageChanged($event)"></app-pagination>
      </div>
    </div>
  </div>
  <!--filter-->
  <div class="col-4">
    <div class="card pt-3">
      <div class="card-title">
        <h5 style="margin: 0">Фильтр</h5>
      </div>
      <app-filter [fields]="_searchFields" (onFilterChanged)="onFilterChanged()"></app-filter>
    </div>
  </div>
</div>
