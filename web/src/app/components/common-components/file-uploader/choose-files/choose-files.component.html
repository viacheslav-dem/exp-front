<div class="file-input-wrapper custom-file-sm" [ngClass]="controlClass()">
  <input type="file" class="form-control file-input" #fileInput
         [accept]="typesAccept()" [multiple]="allowMultiple()" (change)="chooseFiles($event)">
  <label class="file-input-label">Выбрать {{ allowMultiple() ? 'файл(ы)' : 'файл' }} ({{ sizeHint() }})...</label>
</div>
