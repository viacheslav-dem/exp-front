<div class="file-drop-zone"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  [class.drag-over]="isDragOver()">
  <app-choose-files (onFilesChosen)="onFilesChosen($event)" [typesAccept]="typesAccept()"></app-choose-files>
  <div class="d-flex justify-content-between align-items-center mt-1">
    <div class="small text-muted">Перетащите файл сюда или выберите через диалог</div>
    <button type="button" class="btn btn-sm btn-primary" (click)="openFileDialog()" [disabled]="uploadInProgress()">Загрузить</button>
  </div>
  @if (uploadWithoutModal() && uploadInProgress()) {
    <div class="form-group mt-2">
      <div class="d-flex align-items-center gap-2">
        <progress class="progress progress-striped flex-grow-1" [value]="progressValue" max="100"></progress>
        <span class="text-muted small">{{ progressValue }}%</span>
      </div>
    </div>
  }
</div>

@if (!uploadWithoutModal()) {
<app-modal #fileLoaderModal [title]="'Загрузка файла'" >
  <div class="form-group">
    <label>Название</label>
    <input class="form-control" title="Название" [(ngModel)]="fileName" maxlength="255" type="text" [disabled]="uploadInProgress()">
  </div>
  <div class="form-group">
    <label>Описание</label>
    <textarea class="form-control" title="Описание" rows="4" [(ngModel)]="fileDescription" maxlength="2000" [disabled]="uploadInProgress()"></textarea>
  </div>
  @if (uploadInProgress()) {
    <div class="form-group">
      <label class="form-label">Загрузка</label>
      <div class="d-flex align-items-center gap-2">
        <progress class="progress progress-striped flex-grow-1" [value]="progressValue" max="100"></progress>
        <span class="text-muted small">{{ progressValue }}%</span>
      </div>
    </div>
  }
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary me-2" (click)="fileLoaderModal.hide()" [disabled]="uploadInProgress()">Отмена</button>
    <button type="button" class="btn btn-primary" (click)="saveFile()" [disabled]="uploadInProgress()">Загрузить</button>
  </div>
</app-modal>
}
