<div class="form-sub-group">
  <label class="form-group-label">Наименование</label>
  <button class="btn btn-primary float-right mb-1" (click)="getSameProjects()">Найти</button>
  <input type="text" id="title" class="form-control"
    placeholder="название объекта экспертизы" [(ngModel)]="title">

  </div>

  @if (sameProjects.length == 0) {
    <div
      class="alert alert-info italic mb-0">
      Объектов экспертизы не найдено
    </div>
  }
  @for (item of sameProjects; track item) {
    <div>
      <app-project-li [item]="item" [baseItemLink]="'/projects/'"></app-project-li>
    </div>
  }
