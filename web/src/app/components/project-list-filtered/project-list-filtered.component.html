<div class="container-fluid px-4 py-4">
  <div class="mb-4">
    <h5 class="mb-0 fw-bold fs-4">{{filterName()}}</h5>
  </div>
  <div [loadingData]="_loading" class="list-group list-group-flush">
    <div class="mb-3">
      <span class="text-body-secondary fst-italic small">
        Количество объектов: <strong class="ms-2 fs-6">{{_page.totalElements == null ? '...' : _page.totalElements}}</strong>
      </span>
    </div>
    @if (_page.totalElements != null && _page.totalElements === 0 && projects().length == 0) {
      <div class="alert alert-info fst-italic mb-0 rounded-4 shadow-sm border-0 p-3">
        <i class="fas fa-info-circle me-2"></i>Объектов экспертизы не найдено
      </div>
    }
    @for (item of projects(); track item) {
      <div class="mb-3">
        <app-project-li [item]="item" [baseItemLink]="'/projects/'"></app-project-li>
      </div>
    }
    <div class="mt-4">
    <app-pagination [page]="_page" [pagination]="_pagination"
    (onPageChanged)="onPageChanged($event)"></app-pagination>
    </div>
  </div>
</div>
