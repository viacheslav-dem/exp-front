<label class="form-group-label">{{ind + 1}}. {{project | titleAndCode}}</label>

<div class="form-sub-group">
  <app-checkbox [(ngModel)]="customerReplies">
    - ответы на замечания в установленный срок от заказчика экспертизы представлены
  </app-checkbox>
  <app-checkbox [(ngModel)]="singleVoteMode" (onChecked)="toggleVote($event)">
    - единое голосование
  </app-checkbox>
</div>

<div class="form-sub-group">
  <label>
    <b>{{ind + 1}}.1.</b> Финансирование и&nbsp;(или) льготирование реализации
    и&nbsp;(или) стимулирование реализации объекта государственной экспертизы
  </label>
  <label>Целесообразность реализации внедряемых технологий с учетом их оптимальности и инновационности:</label>
  <app-vote-results [ngModel]="formValue().realization" (ngModelChange)="patchForm({ realization: $event })" [all]="(parent?.formValue?.()?.participants?.length ?? 0)"></app-vote-results>
</div>

<div class="form-sub-group">
  <label>
    <b>{{ind + 1}}.2.</b> Создание объектов права промышленной собственности
    при реализации объекта государственной экспертизы:
  </label>
  @if (privacyObjects.length == 0) {
    <div class="mb-1 italic">Не предусматривается</div>
  }
  @for (privacyObject of privacyObjects; track privacyObject; let i = $index) {
    <div class="input-group btn-group input-group-sm mb-2">
      <app-select-catalog
        [catalog]="Catalog.INDUSTRIAL_PROPERTY"
        [(ngModel)]="privacyObjects[i]" (ngModelChange)="markFormChanged()" [resetEnabled]="false"
      ></app-select-catalog>
      <button type="button" class="btn btn-sm btn-outline-danger" (click)="privacyObjects.splice(i, 1); markFormChanged()">&times;</button>
    </div>
  }
  <div class="mb-2">
    <button type="button" class="btn btn-primary btn-sm" (click)="privacyObjects.push(null); markFormChanged()">
      Добавить объект права
    </button>
  </div>
  <app-vote-results [ngModel]="formValue().privacy" (ngModelChange)="patchForm({ privacy: $event })" [all]="(parent?.formValue?.()?.participants?.length ?? 0)"></app-vote-results>
  <app-vote-results #singleVote [(ngModel)]="singleVoteResult"
    [all]="(parent?.formValue?.()?.participants?.length ?? 0)"
    [display]="singleVoteMode"
  ></app-vote-results>
</div>
