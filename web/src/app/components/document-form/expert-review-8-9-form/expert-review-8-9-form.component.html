<div class="form-group">
  <label class="form-group-label">Анализ и оценка объекта экспертизы</label>
  <div class="form-sub-group">
    <label>
      1. Соответствие указанному приоритетному направлению научных исследований в Республике Беларусь и (или)
      научно-технической деятельности в Республики Беларусь:
    </label>
    <textarea [(ngModel)]="_form.accordance"
      name="accordance"
      required
      rows="3" class="form-control"
      placeholder="cоответствие или несоответствие по каждому из перечисленных в материалах приоритетному направлению">
    </textarea>
  </div>

  <div class="form-sub-group">
    <label>
      2. Сведения о проведении маркетинговых и патентных исследований и их результаты:
    </label>
    <textarea [(ngModel)]="_form.marketing"
      name="marketing"
      required
      rows="3" class="form-control"
      placeholder="результаты проведения маркетинговых и патентных исследований по объекту экспертизы">
    </textarea>
  </div>

  <div class="form-sub-group">
    <label>
      3. Приоритетность направления инвестиций во внедряемые технологии:
    </label>
    <textarea [(ngModel)]="_form.investments"
      name="investments"
      required
      rows="3" class="form-control"
      placeholder="анализ и оценка приоритетности направления инвестиций во внедряемые технологии по объекту экспертизы">
    </textarea>
  </div>

  <div class="form-sub-group">
    <label>
      4. Обоснованность расходов по внедряемым технологиям:
    </label>
    <textarea [(ngModel)]="_form.costJustification"
      name="costJustification"
      required
      rows="3" class="form-control"
      placeholder="анализ и оценка обоснованности расходов во внедряемые технологии по объекту экспертизы">
    </textarea>
  </div>

  <div class="form-sub-group">
    <label>
      5. Оценка возможности применения внедряемых технологий на соответствующем производстве:
    </label>
    <textarea [(ngModel)]="_form.application"
      name="application"
      required
      rows="3" class="form-control"
      placeholder="анализ и оценка возможности применения внедряемых технологий по объекту экспертизы ">
    </textarea>
  </div>

  <div class="form-sub-group">
    <label>
      6. Оптимальность выбранных технологий и их инновационность для Республики Беларусь:
    </label>
    <textarea [(ngModel)]="_form.optimality"
      name="optimality"
      required
      rows="3" class="form-control"
      placeholder="анализ и оценка оптимальности и инновационности для Республики Беларусь выбранных технологий по объекту экспертизы">
    </textarea>
  </div>

  <div class="form-sub-group">
    <label>7. Создание объектов права промышленной собственности:</label>
    @if (privacyObjects.length == 0) {
      <div class="mb-2 italic">не предусматривается</div>
    }
    @for (privacyObject of privacyObjects; track privacyObject; let i = $index) {
      <div class="input-group btn-group mb-2">
        <app-select-catalog
          [catalog]="Catalog.INDUSTRIAL_PROPERTY"
          [(ngModel)]="privacyObjects[i]" [resetEnabled]="false"
        ></app-select-catalog>
        <button type="button" class="btn btn-outline-danger" (click)="privacyObjects.splice(i, 1)">&times;</button>
      </div>
    }
    <button type="button" class="btn btn-primary btn-sm" (click)="privacyObjects.push(null)">
      Добавить объект права
    </button>
  </div>

  <div class="form-sub-group">
    <label>
      8. Оценка научно-технического уровня внедряемых технологий по сравнению
      с передовыми технологиями, используемыми в мире:
    </label>
    <textarea [(ngModel)]="_form.technologyLevel"
      name="technologyLevel"
      required
      rows="3" class="form-control"
      placeholder="оценка научно-технического уровня внедряемых технологий по сравнению с передовыми технологиями для объекта экспертизы">
    </textarea>
  </div>

  <div class="form-sub-group">
    <label>
      9. Оценка возможных социальных, экономических и экологических последствий внедрения выбранных технологий
      и необходимости модернизации (реконструкции) взаимосвязанных действующих производственных объектов:
    </label>
    <textarea [(ngModel)]="_form.consequences"
      name="consequences"
      required
      rows="3" class="form-control"
      placeholder="оценка возможных социальных, экономических и экологических последствий внедрения выбранных технологий">
    </textarea>
  </div>
</div>

<div class="form-group">
  <label class="form-group-label">Выводы и предложения эксперта</label>
  <div class="form-sub-group">
    <label>
      1. Целесообразность реализации внедряемых технологий с учетом их оптимальности и инновационности:
    </label>
    <app-boolean-button [(ngModel)]="_form.realization" [falseLabel]="'нецелесообразно'"
    [trueLabel]="'целесообразно'"></app-boolean-button>
  </div>

  <div class="form-sub-group">
    <label>
      2. Замечания по материалам объекта экспертизы, конкретные предложения о необходимости доработки и (или)
      корректировки материалов по объекту экспертизы:
    </label>
    @if (notes.length == 0) {
      <div class="mb-2 italic">не имеются</div>
    }
    @for (note of notes; track note; let i = $index) {
      <div class="input-group btn-group mb-2">
        <textarea [(ngModel)]="note.name" rows="2" class="form-control"
        placeholder="{{i + 1}}) Замечание {{i + 1}}."></textarea>
        <button type="button" class="btn btn-outline-danger" (click)="notes.splice(i, 1)">&times;</button>
      </div>
    }
    <button type="button" class="btn btn-primary btn-sm" (click)="notes.push({name: ''})">
      Добавить замечание
    </button>
  </div>
</div>
