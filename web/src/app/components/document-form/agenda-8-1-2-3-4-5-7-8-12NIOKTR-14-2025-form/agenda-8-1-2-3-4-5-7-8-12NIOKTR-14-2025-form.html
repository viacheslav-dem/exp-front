<hr/>

<app-agenda-header-block [_form]="_form" [ind]="ind" [project]="_project"></app-agenda-header-block>

<div class="collapse" [attr.id]="'meeting-project-' + _project?.id">
    <hr/>

    <app-customer-replies-block [_form]="_form"></app-customer-replies-block>

    <hr/>

    <app-novelty-block-2025
            [_form]="_form"
            [project]="project"
            [num]="'1'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-novelty-block-2025>

    <hr/>

    <app-technological-order-block-2025
            *ngIf="showTarget8_3() || showTarget8_4() || showTarget8_8()"
            [_form]="_form"
            [num]="'2'"
            (onConditionsChanged)="onConditionsChanged()">
    </app-technological-order-block-2025>

    <hr/>

    <app-select-directions-and-goals-block-2025
            [form]="_form"
            [num]="'3'"
            [project]="_project"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-select-directions-and-goals-block-2025>

    <hr/>

    <!-- Для всех, кроме 8.4 -->
    <app-rb-needs-block-2025
            *ngIf="showTargetNot8_4()"
            [_form]="_form"
            [num]="'4'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-rb-needs-block-2025>

    <hr/>

    <app-scientific-research-block-2025
            *ngIf="showTarget8_1() || showTarget8_3() || showTarget8_4()"
            [_form]="_form"
            [project]="_project"
            [num]="'5'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-scientific-research-block-2025>

    <hr/>

    <app-economic-significance-block-2025
            [_form]="_form"
            [num]="'6'"
            [project]="_project"
            (onConditionsChanged)="onConditionsChanged()"
            [isExpertReview] = false
    ></app-economic-significance-block-2025>

    <hr/>

    <app-needed-project-docs-block-2025
            *ngIf="showTarget8_5() || showTarget8_7() || showTarget8_12()"
            [_form]="_form"
            [num]="'7'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-needed-project-docs-block-2025>

    <hr/>

    <app-commerce-block-2025
            *ngIf="showTarget8_1() || showTarget8_3() || showTarget8_4()"
            [_form]="_form"
            [project]="_project"
            [num]="'8'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-commerce-block-2025>

    <hr/>

    <app-resources-sufficiency-block-2025
            [_form]="_form"
            [num]="'9'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-resources-sufficiency-block-2025>

    <hr/>

    <app-competence-sufficiency-block-2025
            [_form]="_form"
            [num]="'10'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-competence-sufficiency-block-2025>

    <hr/>

    <app-marketing-research-block-2025
            [_form]="_form"
            [num]="'11'"
            [project]="_project"
            (onConditionsChanged)="onConditionsChanged()"
            [isExpertReview]="false"
    ></app-marketing-research-block-2025>

    <hr/>

    <app-competitiveness-block-agenda-2025
            [_form]="_form"
            [num]="'12'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-competitiveness-block-agenda-2025>


    <hr/>
    <app-analog-block-2025
            [_form]="_form"
            [num]="'13'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-analog-block-2025>

    <hr/>

    <app-analog-params-block-2025
            [_form]="_form"
            [num]="'14'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-analog-params-block-2025>

    <hr/>

    <app-needs-block-2025
            [_form]="_form"
            [num]="'15'"
            (onConditionsChanged)="onConditionsChanged()"></app-needs-block-2025>
    <hr/>

    <app-risks-block-2025
            [_form]="_form"
            [num]="'16'"
            [_project]="_project"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-risks-block-2025>

    <hr/>

    <app-privacy-block-2025
            [_form]="_form"
            [num]="'17'"
            [_project]="_project"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-privacy-block-2025>

    <hr/>

    <label class="mb-0">
        18. Льготирование реализации объекта государственной экспертизы
    </label>

    <hr/>

    <app-stages-exists-block-2025
            [_form]="_form"
            [num]="'18.1'"
            [askStages]="false"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-stages-exists-block-2025>

    <hr/>

    <app-stages-block-2025
            [_form]="_form"
            [num]="'18.2'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-stages-block-2025>

    <hr/>

    <label class="mb-0">
        19. Реализация и финансирование объекта государственной экспертизы
    </label>

    <hr/>

    <app-name-accordance-block-2025
            [_form]="_form"
            [num]="'19.1'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-name-accordance-block-2025>

    <hr/>

    <app-terms-accordance-block-2025
            [form]="_form"
            [num]="'19.2'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-terms-accordance-block-2025>

    <hr/>

    <app-social-or-security-block-2025
            [_form]="_form"
            [num]="'19.3'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-social-or-security-block-2025>

    <hr/>

    <app-finance-accordance-block-2025
            [_form]="_form"
            [num]="'19.4'"
            [project]="_project"
            [isTextRequired]="true"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-finance-accordance-block-2025>

    <hr/>

    <app-finance-conclusion-block-2025
            [_form]="_form"
            [num]="'19.5'"
            [noveltyNum]="'1'"
            [project]="project"
            [economicSignificanceNum]="'4'"
            (onConditionsChanged)="onConditionsChanged()"
            [disabled]="isFinanceConclusionDisabled()"
    ></app-finance-conclusion-block-2025>

    <hr *ngIf="showTarget8_14()"/>

    <label class="mb-0" *ngIf="showTarget8_14()">
        20. Реализация технического задания по мероприятиям, включенным в ГСНТИ
    </label>

    <hr *ngIf="showTarget8_14()"/>

    <app-sufficiency-block-2025
            *ngIf="showTarget8_14()"
            [_form]="_form"
            [num]="'20.1'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-sufficiency-block-2025>

    <hr *ngIf="showTarget8_14()"/>

    <app-work-accordance-block-2025
            *ngIf="showTarget8_14()"
            [_form]="_form"
            [num]="'20.2'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-work-accordance-block-2025>

    <hr *ngIf="showTarget8_14()"/>

    <app-assessment-conclusion-block-2025
            *ngIf="showTarget8_14()"
            [_form]="_form"
            [num]="'20.3'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-assessment-conclusion-block-2025>

    <hr/>

    <app-section-conclusion-block
            [_form]="_form"
            [num]="'21'"
            [financeConclusionNum]="financeConclusionNum"
            [project]="project"
            [allParticipants]="getAllParticipants()"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-section-conclusion-block>
</div>
