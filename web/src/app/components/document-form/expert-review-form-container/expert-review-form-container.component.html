<div>
  <ng-container *ngIf="_project && _form">

    <div class="form-group">
      <label class="form-group-label">Объект экспертизы: <i>{{_project | titleAndCode}}</i></label>

      <div *ngIf="!needSelectDirections() && _project.directions.length > 0">
        <label>Приоритетное направление научных исследований Республики Беларусь
          и (или) приоритетное направление научно-технической деятельности</label>
        <ul>
          <li *ngFor="let direction of _project.directions" class="italic">{{direction.name}}</li>
        </ul>
      </div>

      <div *ngIf="!needSelectDirections() && canHasSocialEconomicGoals() && _project.socialEconomicGoals.length > 0">
        <label>Цель (приоритет) социально-экономического развития</label>
        <ul>
          <li *ngFor="let item of _project.socialEconomicGoals" class="italic">{{item.name}}</li>
        </ul>
      </div>
    </div>

    <div class="form-group">
      <label>Дата составления заключения</label>
      <app-date-input class="width-100" [(ngModel)]="_form.date"></app-date-input>
    </div>

    <div class="form-group">
      <label>Количество затраченных часов</label>
      <input title="Количество затраченных часов"
             [(ngModel)]="_form.hours" min="1" numberInput type="text" class="form-control" placeholder="Часы">
    </div>

    <app-select-directions-and-goals-block *ngIf="needSelectDirections()"
                                           [form]="_form"
                                           [project]="_project"></app-select-directions-and-goals-block>
  </ng-container>

  <hr/>

  <ng-template #form></ng-template>

  <hr/>

  <div class="mt-2">
    <button type="button" class="btn btn-secondary mr-1" (click)="close()">Закрыть</button>
    <button type="button" class="btn btn-primary mr-1" (click)="save()">Создать</button>
    <div class="mt-1 text-sm italic">Черновик формы автоматически сохраняется каждые 30 секунд и при закрытии формы.</div>
    <div class="mt-1 text-sm italic">Будьте внимательны! Если Вы ранее уже создавали этот документ, то он будет перезаписан.</div>
  </div>
</div>
