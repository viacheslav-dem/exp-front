<hr/>

<app-agenda-header-block [_form]="_form" [ind]="ind" [project]="_project" [expanded]="expanded()" (toggle)="toggleExpanded()"></app-agenda-header-block>

<div class="collapse" [collapse]="!expanded()" [attr.id]="'meeting-project-' + _project?.id">
    <hr/>

    <app-customer-replies-block [_form]="_form"></app-customer-replies-block>

    <hr/>

    <app-economic-significance-block-2025
            [_form]="_form"
            [num]="'1'"
            [project]="project"
            (onConditionsChanged)="onConditionsChanged()"
            [isExpertReview]=false
    ></app-economic-significance-block-2025>

    <hr/>

    <app-resources-sufficiency-block-2025
            [_form]="_form"
            [num]="'2'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-resources-sufficiency-block-2025>

    <hr/>

    <app-competence-sufficiency-block-2025
            [_form]="_form"
            [num]="'3'"
            (onConditionsChanged)="onConditionsChanged()"
            [isExpertReview]=false
    ></app-competence-sufficiency-block-2025>

    <hr/>

    <app-marketing-research-block-2025
            [project]="_project"
            [_form]="_form"
            [num]="'4'"
            (onConditionsChanged)="onConditionsChanged()"
            [isExpertReview]=false
    ></app-marketing-research-block-2025>

    <hr/>

    <app-risks-block-2025
            [_project]="_project"
            [_form]="_form"
            [num]="'5'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-risks-block-2025>

    <hr/>

    <app-privacy-block-2025
            [_project]="_project"
            [_form]="_form"
            [num]="'6'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-privacy-block-2025>

    <hr/>

    <label class="mb-0">
        7. Реализация и финансирование объекта государственной экспертизы
    </label>

    <hr/>

    <app-name-accordance-block-2025
            [_form]="_form"
            [num]="'7.1'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-name-accordance-block-2025>

    <hr/>

    <app-terms-accordance-block-2025
            [form]="_form"
            [num]="'7.2'"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-terms-accordance-block-2025>

    <hr/>

    <app-finance-accordance-block-2025
            [_form]="_form"
            [num]="'7.3'"
            [project]="_project"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-finance-accordance-block-2025>

    <hr/>

    <app-finance-conclusion-block-2025
            [_form]="_form"
            [num]="'7.4'"
            [project]="project"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-finance-conclusion-block-2025>

    <hr/>

    <app-section-conclusion-block
            [_form]="_form"
            [num]="'8'"
            [financeConclusionNum]="financeConclusionNum"
            [project]="project"
            [allParticipants]="getAllParticipants()"
            (onConditionsChanged)="onConditionsChanged()"
    ></app-section-conclusion-block>
</div>
