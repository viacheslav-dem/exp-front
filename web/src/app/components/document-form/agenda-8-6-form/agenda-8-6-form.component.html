<label class="form-group-label">{{ind + 1}}. {{project | titleAndCode}}</label>

<div class="form-sub-group">
  <app-checkbox [(ngModel)]="customerReplies">
    - ответы на замечания в установленный срок от заказчика экспертизы представлены
  </app-checkbox>
  <app-checkbox [(ngModel)]="singleVoteMode" (onChecked)="toggleVote($event)">
    - единое голосование
  </app-checkbox>
</div>

<div class="form-sub-group">
  <label><b>{{ind + 1}}.1.</b> Соответствие достигнутого результата запланированному:</label>
  <app-vote-results [ngModel]="formValue().accordance" (ngModelChange)="patchForm({ accordance: $event })" [all]="(parent?.formValue?.()?.participants?.length ?? 0)"></app-vote-results>
</div>

<div class="form-sub-group">
  <label>
    <b>{{ind + 1}}.2.</b> Соответствие экономического
    и (или) социального эффекта установленным условиям коммерциализации:
  </label>
  <app-vote-results [ngModel]="formValue().effectAccordance" (ngModelChange)="patchForm({ effectAccordance: $event })" [all]="(parent?.formValue?.()?.participants?.length ?? 0)"></app-vote-results>
  <app-vote-results #singleVote [(ngModel)]="singleVoteResult"
                    [all]="(parent?.formValue?.()?.participants?.length ?? 0)"
                    [display]="singleVoteMode"
  ></app-vote-results>
</div>
