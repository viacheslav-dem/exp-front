<div class="main-menu-wrapper">
  <!-- Full-width фон у wrapper, а контент меню выравниваем по сетке через внутренний .container -->
  <div class="container menu-inner">
    <nav class="main-menu navbar navbar-expand-lg navbar-light w-100">
      <div class="d-flex justify-content-between align-items-center w-100">
        <button class="navbar-toggler d-lg-none" type="button"
          (click)="toggleMenu()"
          [attr.aria-expanded]="isMenuOpen()"
          aria-label="Toggle navigation"
          aria-controls="navbarNavDropdown">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="navbar-collapse flex-grow-1"
             [class.show]="isMenuOpen()"
             [class.collapse]="!isMenuOpen()"
             id="navbarNavDropdown">
          <ul class="navbar-nav mx-auto">
            @for (el of menu(); track el) {
              @if (el.children == null || el.children.length == 0) {
                <li class="nav-item">
                  <a class="nav-link"
                     [routerLink]="el.link"
                     [routerLinkActive]="'active'"
                     [routerLinkActiveOptions]="{exact: false}"
                     (click)="closeMenu()">
                    {{el.title}}
                  </a>
                </li>
              }
              @if (el.children != null && el.children.length > 0) {
                <li class="nav-item dropdown"
                    [class.show]="isDropdownOpen(el)">
                  <a class="nav-link dropdown-toggle"
                     href="#"
                     role="button"
                     [attr.aria-expanded]="isDropdownOpen(el)"
                     (click)="toggleDropdown(el); $event.preventDefault()">
                    {{el.title}}
                  </a>
                  <ul class="dropdown-menu shadow-sm" [class.show]="isDropdownOpen(el)">
                    @for (cel of el.children; track cel) {
                      <li>
                        <a class="dropdown-item"
                           [routerLink]="cel.link"
                           [routerLinkActive]="'active'"
                           (click)="closeDropdown()">
                          {{cel.title}}
                        </a>
                      </li>
                    }
                  </ul>
                </li>
              }
            }
          </ul>
        </div>
        <div class="ms-3 flex-shrink-0">
          <app-loginesiful></app-loginesiful>
        </div>
        <div class="ms-3 flex-shrink-0">
          <app-loginoff></app-loginoff>
        </div>
      </div>
    </nav>
  </div>
</div>
